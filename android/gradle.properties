org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.configureondemand=true
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=true

# Release signing secrets live in android/key.properties (git-ignored), loaded
# by android/app/build.gradle.kts. Without that file, release builds fall back
# to the debug keystore. See https://flutter.dev/to/reference-keystore
# Use AGP built-in Kotlin instead of the legacy Kotlin Gradle Plugin.
android.builtInKotlin=true
kotlin_version=2.3.0
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Optimized resource shrinking: resources join the R8 reference graph instead
# of being shrunk in a separate pass, so an unreferenced drawable goes out with
# the code that referenced it. Needs isShrinkResources (already on in
# app/build.gradle.kts) and AGP 8.12+; it becomes the default in AGP 9.0, at
# which point this line can go.
android.r8.optimizedResourceShrinking=true
