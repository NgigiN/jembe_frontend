org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.configureondemand=true
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=true
android.enableR8=true

# Release signing placeholders. Replace with actual values or define via
# local.properties to avoid committing secrets.
RELEASE_STORE_FILE=../keystore/release.keystore
RELEASE_STORE_PASSWORD=changeit
RELEASE_KEY_ALIAS=farmtracker
RELEASE_KEY_PASSWORD=changeit
# Use AGP built-in Kotlin instead of the legacy Kotlin Gradle Plugin.
android.builtInKotlin=true
kotlin_version=2.3.0
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
