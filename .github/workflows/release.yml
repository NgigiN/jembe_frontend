name: Release CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Verify dependencies
        run: flutter pub run dependency_validator
      - name: Analyze code
        run: flutter analyze --no-fatal-infos

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info

  build-web:
    name: Build Web Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Build web console
        # Guards against a regression reintroducing a package:sqlite3/
        # dart:ffi import into lib/main_web.dart's dependency graph —
        # the exact failure mode that took several dedicated tasks to
        # find and fix while this target was first built. flutter analyze
        # and flutter test alone don't catch this: they resolve web-only
        # conditional exports to their VM-safe stub, which never touches
        # dart:ffi in the first place.
        #
        # --dart-define=ENV=production is what puts AppConfig on
        # Environment.remote, i.e. the real API host. Leaving it off is not
        # a subtle degradation: AppConfig's default is `local`, so the
        # deployed console called http://10.0.2.2:8080 — the Android
        # emulator's host alias — from an HTTPS page, and the browser
        # blocked it as mixed content. Every other release build in this
        # workflow passes the same flag; this one did not.
        #
        # REMOTE_API_URL is deliberately not passed: AppConfig's default is
        # already the production host, and naming it in two places is how
        # the two drift apart.
        #
        # --base-href=/console/ because the console is served under a path on the
        # existing API host (no CORS, no second certificate, and it inherits the
        # Cloudflare proxy that host already sits behind). Without it every asset
        # URL is rooted at / and the app loads nothing.
        run: |
          flutter build web \
            -t lib/main_web.dart \
            --release \
            --dart-define=ENV=production \
            --base-href=/console/

      - name: Deploy web console
        # PUSH TO MAIN ONLY. This workflow also runs on pull_request, and this is a
        # public repository — a deploy step that did not check the event would try to
        # run for every PR, including from forks.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # The VPS key carries a forced command (infra-ops:
        # vps-security/bin/ci-dispatch), so the only thing this may send is
        # `deploy-console production`. Anything else is refused and logged.
        #
        # The bundle goes over STDIN because scp cannot run behind a forced command —
        # its remote half is `scp -t`, which the dispatcher refuses.
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CONSOLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

          # A build that produced no entry point is a failed build. index.html without
          # main.dart.js serves a blank page with HTTP 200, which looks healthy to every
          # monitor — so check for both here and again server-side.
          test -f build/web/index.html   || { echo "::error::build produced no index.html"; exit 1; }
          test -f build/web/main.dart.js || { echo "::error::build produced no main.dart.js"; exit 1; }

          tar -czf - -C build/web . | ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "deploy-console production"

  build-size-check:
    name: Check Build Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Create debug keystore
        run: |
          mkdir -p ~/.config/.android
          keytool -genkey -v \
            -keystore ~/.config/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build app bundle
        run: |
          flutter build appbundle \
            --release \
            --dart-define=ENV=production \
            --obfuscate \
            --split-debug-info=build/split-info \
            --tree-shake-icons
      - name: Check size limit
        run: |
          SIZE=$(du -sh build/app/outputs/bundle/release/app-release.aab | cut -f1)
          echo "App bundle size: $SIZE"
          # Fail if size exceeds 80MB (approximate check; this is the raw
          # multi-ABI .aab, not the smaller per-device download size)
          if [ $(du -m build/app/outputs/bundle/release/app-release.aab | cut -f1) -gt 80 ]; then
            echo "ERROR: App bundle exceeds 80MB limit"
            exit 1
          fi


      - name: Analyze size (informational)
        run: |
          flutter build appbundle --analyze-size --release
        continue-on-error: true
