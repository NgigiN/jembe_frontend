name: Release CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Verify dependencies
        run: flutter pub run dependency_validator
      - name: Analyze code
        run: flutter analyze --no-fatal-infos

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info

  build-size-check:
    name: Check Build Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Create debug keystore
        run: |
          mkdir -p ~/.config/.android
          keytool -genkey -v \
            -keystore ~/.config/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build app bundle
        run: |
          flutter build appbundle \
            --release \
            --dart-define=ENV=production \
            --obfuscate \
            --split-debug-info=build/split-info \
            --tree-shake-icons
      - name: Check size limit
        run: |
          SIZE=$(du -sh build/app/outputs/bundle/release/app-release.aab | cut -f1)
          echo "App bundle size: $SIZE"
          # Fail if size exceeds 80MB (approximate check; this is the raw
          # multi-ABI .aab, not the smaller per-device download size)
          if [ $(du -m build/app/outputs/bundle/release/app-release.aab | cut -f1) -gt 80 ]; then
            echo "ERROR: App bundle exceeds 80MB limit"
            exit 1
          fi


      - name: Analyze size (informational)
        run: |
          flutter build appbundle --analyze-size --release
        continue-on-error: true
