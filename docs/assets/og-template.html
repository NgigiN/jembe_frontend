<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Fraunces"; src: url("fonts/Fraunces-var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Work Sans"; src: url("fonts/WorkSans-var.woff2") format("woff2"); font-weight: 100 900; }
html, body { margin: 0; width: 1200px; height: 630px; background: #ffffff; }
.card { box-sizing: border-box; width: 1200px; height: 630px; padding: 88px 96px; display: flex; flex-direction: column; justify-content: space-between; font-family: "Work Sans", sans-serif; color: #111511; }
.brand { display: flex; align-items: center; gap: 18px; font-weight: 600; font-size: 30px; }
.brand img { width: 56px; height: 56px; border-radius: 12px; }
.rule { width: 64px; height: 2px; background: #2e7d32; margin-bottom: 28px; }
h1 { font-family: "Fraunces", serif; font-weight: 600; font-size: 84px; line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 24px; max-width: 16ch; }
p { margin: 0; font-size: 28px; color: #5a635c; max-width: 30ch; }
.foot { font-size: 22px; color: #5a635c; }
.foot b { color: #2e7d32; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img src="logo.png" alt="">Shamba+</div>
  <div>
    <div class="rule"></div>
    <h1>Know what your farm actually earns.</h1>
    <p>Farm finance for Kenyan smallholders. Crops, livestock, costs and sales in one place.</p>
  </div>
  <div class="foot"><b>shamba.samtama.lol</b> · Built in Kenya</div>
</div>
</body>
</html>
